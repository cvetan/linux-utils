name: Build

# Builds the same makeself archive the release ships, on every pull request and
# push to main, and hands it back as a workflow artifact — download it, run it on
# a throwaway VM, and know before the tag whether it works.
#
# This job never touches a release. See release.yml for the publishing half.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the archive
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned image, because the makeself version comes from apt and floats with
      # the runner (2.5.0-1 on noble).
      - name: Install makeself
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends makeself
          makeself --version

      # The commit, not a version: there is no release to name it after yet.
      # Invoked through `bash` so a checkout that lost the executable bit fails
      # on nothing.
      - name: Build and verify the archive
        run: bash scripts/build-archive.sh "ci-${GITHUB_SHA::7}" dist

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-utils-${{ github.sha }}
          path: |
            dist/linux-utils-*.run
            dist/linux-utils-*.run.sha256
          if-no-files-found: error
